version: '3.8'

services:
  cyberchat-db:
    image: postgres:15-alpine
    container_name: cyberchat-postgres
    environment:
      POSTGRES_DB: cyber_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cyberchat" ]
      interval: 10s
      timeout: 5s
      retries: 5

  cyberchat-redis:
    image: redis:7-alpine
    container_name: cyberchat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  cyberchat-minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: cyberchat-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  cyberchat-api:
    image: cyberchat-api:latest
    container_name: cyberchat-api
    build:
      context: .
      dockerfile: src/CyberChat.API/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=cyberchat-db;Port=5432;Database=cyberchat;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=cyberchat-redis:6379
      - Minio__Endpoint=cyberchat-minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadminpassword
      - Minio__Secure=false
    depends_on:
      cyberchat-db:
        condition: service_healthy
      cyberchat-redis:
        condition: service_healthy
      cyberchat-minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
